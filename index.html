<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiny Platformer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <header>
        <h1>Tiny Platformer</h1>
        <p>Run, jump, and collect every coin.</p>
      </header>

      <section class="scoreboard">
        <div class="score-card">
          <span class="label">Score</span>
          <span id="score" class="value">0</span>
        </div>
        <div class="score-card">
          <span class="label">Best</span>
          <span id="highScore" class="value">0</span>
        </div>
      </section>

      <canvas
        id="gameCanvas"
        width="640"
        height="360"
        aria-label="Platformer game world"
      ></canvas>

      <p id="statusText" class="status">Press Start to play.</p>

      <section class="controls">
        <button id="startPauseButton" type="button">Start</button>
        <button id="restartButton" type="button">Restart</button>
      </section>

      <section class="help">
        <h2>Controls</h2>
        <ul>
          <li>Move: Arrow keys or A / D</li>
          <li>Jump: W, Up, or Space</li>
          <li>Start / Pause: Enter</li>
          <li>Restart: R</li>
          <li>Swap game art by replacing files in <code>assets/</code>.</li>
        </ul>
      </section>
    </main>

    <script src="./game.js"></script>
  </body>
</html>
