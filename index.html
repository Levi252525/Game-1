<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grass Platform Jumper</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <h1>Grass Platform Jumper</h1>
      <p class="subtitle">Move with A/D or Arrow keys. Jump with Space, W, or Up.</p>
      <canvas
        id="gameCanvas"
        width="960"
        height="540"
        aria-label="Simple platformer game world"
      ></canvas>
      <p class="hint">A small space to run and jump around.</p>
    </main>
    <script src="./game.js"></script>
  </body>
</html>
