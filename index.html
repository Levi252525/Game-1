<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake Sprint</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <header>
        <h1>Snake Sprint</h1>
        <p>Collect food, grow longer, and survive as speed increases.</p>
      </header>

      <section class="scoreboard">
        <div class="score-card">
          <span class="label">Score</span>
          <span id="score" class="value">0</span>
        </div>
        <div class="score-card">
          <span class="label">Best</span>
          <span id="highScore" class="value">0</span>
        </div>
      </section>

      <canvas
        id="gameCanvas"
        width="400"
        height="400"
        aria-label="Snake game board"
      ></canvas>

      <p id="statusText" class="status">Press Start or hit Space to play.</p>

      <section class="controls">
        <button id="startPauseButton" type="button">Start</button>
        <button id="restartButton" type="button">Restart</button>
      </section>

      <section class="help">
        <h2>Controls</h2>
        <ul>
          <li>Move: Arrow keys or WASD</li>
          <li>Start / Pause: Space</li>
          <li>Restart: R</li>
        </ul>
      </section>
    </main>

    <script src="./game.js"></script>
  </body>
</html>
